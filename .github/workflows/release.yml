name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: cisco-forenzic-linux-amd64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            artifact: cisco-forenzic-darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: cisco-forenzic-darwin-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact: cisco-forenzic-windows-amd64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd cisco-dashboard-frontend
          npm ci
          npm run build

      - name: Copy frontend to embed directory
        shell: bash
        run: |
          rm -rf frontend/build
          cp -r cisco-dashboard-frontend/build frontend/build

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w" -o dist/${{ matrix.artifact }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create zip files
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            cd "$name"
            zip "../${name}.zip" *
            cd ..
          done
          ls -lh *.zip

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*.zip
          generate_release_notes: true
